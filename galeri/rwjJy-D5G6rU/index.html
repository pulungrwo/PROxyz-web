<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8fafc">
  <title>Tanjung Bulan · Galeri PROxyz</title>
  <link rel="stylesheet" href="../assets/gallery.css?v=2.4.1">
</head>
<body data-gallery-token="rwjJy-D5G6rU">
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">P</span>
        <p class="brand">GALERI PROxyz</p>
        <span class="gallery-id">tb</span>
      </div>
      <h1>Tanjung Bulan</h1>
      <div class="hero-meta">
        <span id="gallery-count" class="hero-stat">Memuat…</span>
        <span class="dot">•</span>
        <span id="gallery-updated">menyiapkan galeri</span>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Pencarian dan filter galeri">
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Cari keterangan foto…" autocomplete="off">
      </label>
      <select id="period" aria-label="Periode">
        <option value="all">Semua waktu</option>
        <option value="today">Hari ini</option>
        <option value="month">Bulan ini</option>
        <option value="year">Tahun ini</option>
      </select>
    </section>

    <section class="result-bar" aria-live="polite">
      <span id="result-count">Memuat foto…</span>
      <span id="page-range"></span>
    </section>

    <section id="gallery" class="gallery" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Belum ada foto yang sesuai.</p>

    <nav id="pagination" class="pagination" aria-label="Navigasi halaman" hidden>
      <button id="page-prev" class="page-arrow" type="button">← <span>Sebelumnya</span></button>
      <div id="page-numbers" class="page-numbers"></div>
      <button id="page-next" class="page-arrow" type="button"><span>Berikutnya</span> →</button>
    </nav>
  </main>

  <dialog id="viewer">
    <div class="viewer-topbar">
      <span id="viewer-position" class="viewer-position"></span>
      <button id="close-viewer" class="close" type="button" aria-label="Tutup">×</button>
    </div>
    <div id="viewer-feed" class="viewer-feed" aria-label="Penampil foto"></div>
  </dialog>

  <footer>
    <div class="footer-inner">
      <div>
        <strong>Galeri PROxyz</strong>
        <span>Dokumentasi bersama, tersimpan di cloud.</span>
      </div>
      <span id="footer-page" class="footer-page"></span>
    </div>
  </footer>
  <script src="../assets/gallery.js?v=2.4.1" defer></script>
</body>
</html>
